# Construit Moulinette pour Windows (impossible depuis un Mac) et publie un .zip à télécharger.
# Se lance à chaque étiquette v* (ex. v1.0.0) ou à la main depuis l'onglet Actions.
name: Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
      - run: flutter pub get
      - run: flutter test test/ecrans_test.dart
      - run: flutter build windows --release
      - name: Paquet zip
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version: (\S+)\+').Matches[0].Groups[1].Value
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "Moulinette-$v-windows.zip"
          echo "ZIP=Moulinette-$v-windows.zip" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: Moulinette-windows
          path: ${{ env.ZIP }}
